id = "elijaharch/wl-screen-mirror"
name = "Wayland Screen Mirror"
version = "1.2.0"
plugin_api = 33
author = "elijaharch"
license = "MIT"
dependencies = ["wl-mirror", "wlr-randr", "python3"]
tags = ["bar", "panel", "service", "shortcut", "utility", "video"]
icon = "screen-share"
description = "Identify and arrange multiple Wayland displays, switch layouts safely, and mirror a selected pair."

[[widget]]
id = "mirror"
entry = "widget.luau"

[[panel]]
id = "controls"
entry = "panel.luau"
width = 420
height = 390
placement = "attached"
position = "auto"
open_near_click = true

[[service]]
id = "mirror-service"
entry = "service.luau"

[[shortcut]]
id = "open-controls"
entry = "shortcut.luau"

[[panel]]
id = "projection"
entry = "projection-panel.luau"
width = 900
height = 760
placement = "floating"
position = "center"
dismiss_on_outside_click = false
persistent = true

[[service]]
id = "projection-service"
entry = "projection-service.luau"
